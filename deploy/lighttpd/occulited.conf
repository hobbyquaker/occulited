# openccu-lite: lighttpd wiring for occulited (D-3, D-18, D-28, D-29).
# Installed by the fork's package/occulited as /etc/lighttpd/conf.d/occulited.conf. lighttpd is what faces the
# LAN; occulited listens on the loopback only.
#
# What goes where:
#   /.well-known/acme-challenge/ -> occulited, no session (task 35: the HTTP-01 challenge)
#   /api/...        -> occulited (the metadata, system and auth APIs)
#   /addons/...     -> occulited, behind the session gate below: the CGIs since task 18, the static
#                      files since B-120 (as occulite, never through a link out of the addon's tree)
#   everything else -> occulited (the shell: the Svelte UI with its SPA fallback), except the WebUI's
#                      files addons read at the CCU's URLs (/config/img/devices/, /config/devdescr/DEVDB.tcl,
#                      /config/stringtable_de.txt, /webui/js/lang/<lang>/translate.lang*.js): lighttpd serves
#                      those itself, read-only from /www (the fork's lite webui.conf, after this file;
#                      openccu-lite task 331)
#
# The XML-RPC proxies of the CCU (2001/2000/2010 and their TLS twins) are deliberately absent.
#
# While occulited does not answer, the API and the shell get lighttpd's waiting answer instead of a
# bare 503 (occulite-starting.lua: the waiting page for browsers, JSON with Retry-After for the API).
# The addon pages need no hook: the gate fails closed without occulited and redirects to the login,
# which is the shell. Addons' own backends keep their own error pages.
#
# This fragment is included from the lite overlay's conf.d/webui.conf, i.e. inside every
# $SERVER["socket"] block of proxy.conf - so no server.modules here (global scope only):
# mod_proxy, mod_setenv are in the base modules.conf, mod_magnet in the lite overlay's copy.

# task 35 (D-48): the ACME HTTP-01 challenge. The CA fetches http://<name>/.well-known/
# acme-challenge/<token> on port 80; occulited's open route answers only the tokens of an order
# in flight and 404 for anything else. Listed on its own so the intent is on the page, and so
# the HTTPS redirect (conf.d/httpsredirect.conf in the fork) can leave exactly this path alone.
$HTTP["url"] =~ "^/\.well-known/acme-challenge/" {
    proxy.server = ( "" => ( ( "host" => "127.0.0.1", "port" => 8183 ) ) )
    proxy.forwarded = ( "for" => 1, "proto" => 1 )
    # a GET route: no body to speak of (kilobytes)
    server.max-request-size = 16
}

# Cache-Control (occulited B-121): the base setenv.conf sets one on every answer, which replaced
# occulited's own (no-store on the API's secrets, immutable on the shell's hashed assets) and an
# addon's (ccu-addon-kit's immutable /assets/). The three blocks below take it out of
# setenv.set-response-header - "Server" => "" is the rest of that list, kept - and
# occulite-starting.lua sets setenv.conf's value only on an answer without one of its own.
# (setenv.set-response-header in a URL block replaces the outer list; add-response-header, HSTS's
# and the security headers' list, is not touched.)

# occulited: API and shell
$HTTP["url"] =~ "^/api/" {
    proxy.server = ( "" => ( ( "host" => "127.0.0.1", "port" => 8183 ) ) )
    proxy.forwarded = ( "for" => 1, "proto" => 1 )
    setenv.set-response-header = ( "Server" => "" )
    magnet.attract-response-start-to = ( "/etc/lighttpd/occulite-starting.lua" )
    # the change stream is long-lived; do not buffer it
    proxy.header = ( "upgrade" => "enable" )
    # Request bodies in front of occulited (openccu-lite B-239). lighttpd streams every body to the
    # backend and its global server.max-request-size (2.25 GiB, the fork's post-build) is sized for
    # the uploads; but a body lighttpd takes faster than the backend reads it is buffered in the
    # upload directory before any session or scope has been seen. So everything that is not an
    # upload route - the login and the other open routes above all, and every JSON route, whose own
    # caps in occulited are 4 KiB to 4 MiB - is capped at 8 MiB here (kilobytes), and only the
    # routes that take an archive, an image, a backup or a database keep the global ceiling. A new
    # upload route is added to this list, and TestLighttpdUploadRoutes in internal/httpapi keeps the
    # list and the route table together.
    $HTTP["url"] !~ "^/api/(system/v1/(addons/install|radio/firmware/upload|firmware/upload|restore/check|system-update/upload)|meta/v1/import/regadom)$" {
        server.max-request-size = 8192
    }
}

# addon pages: only with a live occulited session (D-28) - the gate cookie occulite_gate at
# Path=/addons/ since task 259, the API's cookie never arrives here - and everything under them answered by
# occulited (B-120: lighttpd, its own user now, opens no addon file itself; an addon's drop-in that
# proxies a path of its own to its own server still wins, being included after this file)
#
# The gate also hands the addon the session it validated as X-Occulite-Session and removes a
# client-sent one first. This block replaces the global magnet.attract-raw-url-to of
# the fork's lite modules.conf, which removes that header from every request the gate does not see
# (/api, the shell, and whatever an addon's drop-in proxies outside /addons/); the gate removes it
# itself, so it does not depend on that script running before it. The header goes only to what
# lies behind this block: addon files, CGIs and the addons' own proxies - not to /api or the shell.
$HTTP["url"] =~ "^/addons/" {
    magnet.attract-raw-url-to = ( "/etc/lighttpd/occulite-gate.lua" )
    # the CGIs run through occulited (task 18): as the addon's own user where it has one, with
    # the same environment mod_cgi gave them; the static files come from occulited too (B-120)
    proxy.server = ( "" => ( ( "host" => "127.0.0.1", "port" => 8183 ) ) )
    proxy.forwarded = ( "for" => 1, "proto" => 1 )
    # an addon's own Cache-Control passes, the default only where it has none (B-121, above); the
    # script does nothing else here - no waiting page for an addon's own 502
    setenv.set-response-header = ( "Server" => "" )
    magnet.attract-response-start-to = ( "/etc/lighttpd/occulite-starting.lua" )
}

# the shell for everything that is neither API nor addon: GET routes, so a body is not expected
# (64 KiB, in kilobytes, leaves room for a form post that lands here by mistake and answers 405)
#
# The shell's Content-Security-Policy and Permissions-Policy (openccu-lite task 259, F-5) are not
# set here but by occulited itself, on the shell's own answers (internal/ui/csp.txt): this block
# also matches the ACME challenge above and any path an addon's drop-in claims outside /addons/
# (RedMatic's /description.xml), which must not get the shell's policy - and a
# setenv.add-response-header += in a URL block replaces the socket block's list, which took HSTS
# (conf.d/hsts.conf) off the shell when it was tried (the fork's lite-lighttpd-redirect-test.sh).
$HTTP["url"] !~ "^/(api|addons)/" {
    proxy.server = ( "" => ( ( "host" => "127.0.0.1", "port" => 8183 ) ) )
    proxy.forwarded = ( "for" => 1, "proto" => 1 )
    setenv.set-response-header = ( "Server" => "" )
    magnet.attract-response-start-to = ( "/etc/lighttpd/occulite-starting.lua" )
    server.max-request-size = 64
}
