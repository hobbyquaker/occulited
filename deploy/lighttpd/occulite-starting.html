<!doctype html>
<!--
  openccu-lite's waiting page: lighttpd answers with it, under the URL that was asked for, while
  occulited does not answer (at boot, during a restart). It polls the health route and reloads
  once occulited is back; after a reboot started from the web interface it continues the
  countdown bar that page began.

  Generated by ui/scripts/starting-page.mjs from ui/src/starting/template.html and
  ui/src/starting/page.ts, which bundles the same countdown code as the web interface
  (ui/src/lib/bootbar.ts). Edit those and run npm run build; do not edit the generated file.

  Placeholders, each a name between two at signs, replaced by S50lighttpd with sed at lighttpd start:
    HOSTNAME  the box's hostname
    VERSION   the firmware version, e.g. 1.0.0-alpha.0
    PLATFORM  the product from /VERSION: rpi3, rpi4, rpi5, ova, ...
    IP        the box's IPv4 address for the recovery hint (an IPv6 address without brackets)
  A placeholder left as it is shows nothing.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<noscript><meta http-equiv="refresh" content="10"></noscript>
<title>openccu-lite</title>
<style>
:root{--bg:#fff;--fg:#3b3b3b;--muted:#6d6d6d;--accent:#0070c1;--track:#e2eefa;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1f26;--fg:#ccd2dc;--muted:#8b94a3;--accent:#569cd6;--track:#253b52;color-scheme:dark}}
:root[data-theme=dark]{--bg:#1b1f26;--fg:#ccd2dc;--muted:#8b94a3;--accent:#569cd6;--track:#253b52;color-scheme:dark}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;min-height:100vh;box-sizing:border-box;padding:16px;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.box{width:100%;max-width:420px;text-align:center}
.logo{display:block;height:40px;width:auto;max-width:100%;margin:0 auto 24px}
.logo-dark{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .logo-light{display:none}:root:not([data-theme=light]) .logo-dark{display:block}}
:root[data-theme=dark] .logo-light{display:none}
:root[data-theme=dark] .logo-dark{display:block}
h1{margin:0 0 4px;font-size:18px;font-weight:600}
.ident{margin:0;color:var(--muted);overflow-wrap:anywhere}
.spinner{width:28px;height:28px;margin:24px auto 0;box-sizing:border-box;border-radius:50%;border:3px solid var(--track);border-top-color:var(--accent);animation:spin 1.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bar{display:flex;justify-content:flex-end;height:8px;margin:24px 0 0;border-radius:4px;overflow:hidden;background:var(--track)}
.fill{height:100%;width:100%;border-radius:inherit;background:var(--accent)}
.bar.indeterminate .fill{opacity:.35;background:repeating-linear-gradient(-45deg,var(--accent) 0 8px,transparent 8px 16px);background-size:22.63px 100%;animation:stripe 1.6s linear infinite}
@keyframes stripe{to{background-position:22.63px 0}}
.text{margin:8px 0 0;color:var(--muted);font-variant-numeric:tabular-nums}
.state{margin:16px 0 0;overflow-wrap:anywhere}
.hint{margin:20px 0 0;overflow-wrap:anywhere}
a{color:var(--accent)}
@media (prefers-reduced-motion:reduce){.spinner,.fill{animation:none!important}}
</style>
</head>
<body data-hostname="@HOSTNAME@" data-version="@VERSION@" data-platform="@PLATFORM@" data-ip="@IP@">
