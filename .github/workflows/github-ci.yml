# CI for occulited on GitHub-hosted runners: every push to master and every pull request.
# The same checks as ci.yml, which runs on the project's own runner and is skipped on GitHub; this
# one is skipped everywhere else (the job's `if`). It uses no secrets and only reads the repository,
# so a pull request from a fork runs it as it is.
name: github-ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          # the Go buildroot 2026.08.1 builds the image's occulited with; staticcheck 2026.2.2 and
          # x/tools v0.50.0 are the first to read its export data (version 5; task 117)
          go-version: '1.27.2'
      - name: staticcheck, gofmt, go vet, go test
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          "$(go env GOPATH)/bin/staticcheck" ./...
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "gofmt"; exit 1; }
          go vet ./...
          go test -cover ./...
      - name: go test, with the race detector
        run: go test -race ./...
      - name: Static cross-builds
        run: |
          scripts/build.sh
          ls -la dist/
      - name: The conformance corpus parses
        run: |
          python3 - <<'PY'
          import json, glob
          n = 0
          for f in glob.glob('fixtures/**/*.json', recursive=True):
              json.load(open(f)); n += 1
          print(n, 'fixture files parse')
          PY

  ui:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        working-directory: ui
        run: npm ci --no-audit --no-fund
      - name: svelte-check
        working-directory: ui
        run: npm run check
      - name: Unit tests
        working-directory: ui
        run: npm test
      - name: Build
        working-directory: ui
        run: npm run build
      - name: The committed UI is fresh
        run: |
          git status --porcelain internal/ui/dist
          test -z "$(git status --porcelain internal/ui/dist)" || { echo "internal/ui/dist differs from a fresh build: run 'cd ui && npm run build' and commit"; exit 1; }
      - name: The API documents lint (openccu-lite task 298)
        # docs/openapi.json and docs/asyncapi.json are generated and diff-checked by go test
        # (TestAPIDocuments, TestEveryRouteDocumented); this checks they are valid documents
        run: |
          npx --yes @redocly/cli@2.55.0 lint docs/openapi.json
          npx --yes @stoplight/spectral-cli@6.16.3 lint --fail-severity error docs/asyncapi.json
      - name: Every string is in German
        run: python3 scripts/i18n-check.py
      - name: User-facing text says "the system" and "Sie"
        run: python3 scripts/test_wording_check.py && python3 scripts/wording-check.py
      - name: No space is lost after an {#if}/{:else} tag
        run: python3 scripts/test_block_space_check.py && python3 scripts/block-space-check.py
      - name: No real device identifiers, only invented ones
        run: python3 scripts/test_ids_check.py && python3 scripts/ids-check.py
      - name: The version is the commit, not the image's v* tag (occulited task 16)
        run: python3 scripts/test_version.py
      - name: The resolved catalogue's branch is appended to, never force-pushed (occulited task 124)
        run: python3 scripts/test_catalog_resolved_publish.py
      - name: The UI in a browser
        working-directory: ui
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ui/playwright-report
          retention-days: 7
